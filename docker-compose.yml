services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    # La página no va dentro de la imagen: se monta de solo lectura en /frontend.
    volumes:
      - ./frontend:/frontend:ro
    environment:
      REDIS_URL: redis://redis:6379/0
      REDIS_TIMEOUT_MS: ${REDIS_TIMEOUT_MS:-}
      RATE_LIMIT_IP_MAX: ${RATE_LIMIT_IP_MAX:-}
      RATE_LIMIT_IP_WINDOW_SECONDS: ${RATE_LIMIT_IP_WINDOW_SECONDS:-}
      RATE_LIMIT_EMAIL_MAX: ${RATE_LIMIT_EMAIL_MAX:-}
      RATE_LIMIT_EMAIL_WINDOW_SECONDS: ${RATE_LIMIT_EMAIL_WINDOW_SECONDS:-}
      MX_DNS_TIMEOUT_MS: ${MX_DNS_TIMEOUT_MS:-}
      DEBUG_CLIENT_IP_HEADER: ${DEBUG_CLIENT_IP_HEADER:-}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-}
      # Mismas variables y defaults que el servicio postgres de abajo.
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esto}
      POSTGRES_DB: ${POSTGRES_DB:-guardian}
    depends_on:
      - postgres
      - redis
    # Sano cuando /health responde. Solo librería estándar: la imagen slim no trae curl.
    # start_period: la API tarda ~5 s en cargar sus bases; los fallos de ese arranque no cuentan.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Los valores por defecto de postgres son SOLO para desarrollo y datos sintéticos.
  # En producción las credenciales vendrían de un gestor de secretos.
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esto}
      POSTGRES_DB: ${POSTGRES_DB:-guardian}

  redis:
    image: redis:7.4.1

  # Bots de prueba con Playwright (Fase 6). Por el profile NO se construye ni se levanta con un
  # "docker compose up" normal; solo con: docker compose --profile bots run --rm bots ...
  bots:
    build: ./bots
    profiles: ["bots"]
    # Los scripts se montan de solo lectura; el bot llega a la API por la red de compose (http://api:8000).
    volumes:
      - ./scripts:/work/scripts:ro
      # Lectura-escritura: los resultados de la campaña sobreviven al --rm.
      - ./data:/work/data
      # Solo lectura: bases de IP (niveles 3 y 3b) y pesos del motor para las métricas sin device_reuse.
      - ./backend:/work/backend:ro
    working_dir: /work
    environment:
      API_URL: http://api:8000
      # Mismas variables y defaults que el servicio postgres: sin credenciales nuevas.
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambia_esto}
      POSTGRES_DB: ${POSTGRES_DB:-guardian}
    # Espera a que la API responda, no solo a que su contenedor arranque.
    depends_on:
      api:
        condition: service_healthy
